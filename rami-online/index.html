<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2e1a" />
    <title>רמי אקסטרים · אונליין</title>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0d2e1a; }
      * { -webkit-tap-highlight-color: transparent; }

      /* Boot failure panel — hidden until the watchdog below decides the app never mounted. */
      #boot-error {
        display: none;
        position: fixed; inset: 0; z-index: 9999;
        align-items: center; justify-content: center;
        padding: 16px; direction: rtl;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0d2e1a;
      }
      #boot-error.show { display: flex; }
      #boot-error .card {
        background: #faf7f0; border-radius: 22px; padding: 26px 24px;
        max-width: 390px; width: 100%; text-align: center;
        border: 2px solid #c9a84777; box-shadow: 0 24px 72px rgba(0,0,0,.6);
      }
      #boot-error h1 { margin: 0 0 6px; font-size: 20px; color: #0d2e1a; }
      #boot-error p { margin: 0 0 14px; font-size: 14px; color: #57534e; line-height: 1.6; }
      #boot-error code {
        display: block; margin: 10px 0 0; padding: 8px 10px; border-radius: 8px;
        background: #f5f5f4; color: #b91c1c; font-size: 12px; direction: ltr;
        text-align: left; white-space: pre-wrap; word-break: break-all; max-height: 120px;
        overflow: auto;
      }
      #boot-diag {
        margin-top: 10px; padding: 8px 10px; border-radius: 8px;
        background: #fafaf9; border: 1px solid #e7e5e4;
        font-size: 12px; color: #1c1917; line-height: 1.7; text-align: right;
      }
      /* Block, not inline: an LTR path inside an RTL panel gets its leading
         slash reordered to the end unless it sits in its own box. */
      #boot-diag .raw {
        display: block; direction: ltr; text-align: left; color: #57534e;
        font-family: monospace; font-size: 11px;
      }
      #boot-error button {
        width: 100%; padding: 13px 0; background: #14532d; color: #c9a847;
        border: 2px solid #c9a84788; border-radius: 13px;
        font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-error">
      <div class="card">
        <div style="font-size:44px;margin-bottom:6px">🃏</div>
        <h1>המשחק לא נטען</h1>
        <p>
          קבצי האפליקציה לא הגיעו מהשרת, ולכן המסך נשאר ריק.<br />
          בדרך כלל זה אומר שהאתר הועלה בלי <code style="display:inline;padding:1px 5px;color:#14532d;background:#e7e5e4;direction:ltr">npm run build</code>
          או שתיקיית <code style="display:inline;padding:1px 5px;color:#14532d;background:#e7e5e4;direction:ltr">dist</code> לא נפרסה.
        </p>
        <button onclick="location.reload()">↻ נסה שוב</button>
        <code id="boot-error-detail" style="display:none"></code>
        <div id="boot-diag" style="display:none"></div>
      </div>
    </div>

    <!--
      Classic (non-module) watchdog: it runs even when the module bundle itself
      fails to parse or 404s, which is exactly the case a module script cannot
      report for itself. Without it a broken deploy renders as a silent green page.
    -->
    <script>
      (function () {
        var detail = '';

        function note(msg) {
          if (!detail && msg) detail = String(msg).slice(0, 400);
        }

        // Resource errors (a 404 or wrong MIME on the bundle) do not bubble,
        // so listen in the capture phase.
        window.addEventListener('error', function (e) {
          if (e.target && e.target !== window && e.target.src) note('failed to load: ' + e.target.src);
          else note(e.message);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          note(e.reason && e.reason.message ? e.reason.message : e.reason);
        });

        // Returns true when the failure panel was shown, false when the app is fine.
        function check() {
          var root = document.getElementById('root');
          if (root && root.childNodes.length) return false; // React mounted — nothing to do.
          var panel = document.getElementById('boot-error');
          if (!panel) return false;
          if (detail) {
            var box = document.getElementById('boot-error-detail');
            box.textContent = detail;
            box.style.display = 'block';
          }
          panel.className = 'show';
          return true;
        }

        // Once we know the page is broken, ask the server two questions whose
        // answers separate "the Worker is not running at all" from "the Worker
        // runs but is serving the wrong files". Printed on the page so a
        // screenshot is enough to tell the two apart.
        function diagnose() {
          var box = document.getElementById('boot-diag');
          if (!box || !window.fetch) return;
          var lines = [];
          function draw() { box.innerHTML = lines.join(''); box.style.display = 'block'; }

          function probe(path, cb) {
            return fetch(path, { cache: 'no-store' }).then(function (r) {
              return r.text().then(function (t) { cb(r.status, t); });
            }).catch(function () { cb(0, ''); });
          }

          probe('/api/new', function (status, body) {
            var workerUp = status === 200 && body.indexOf('code') !== -1;
            lines.push('<div>' + (workerUp ? '\u2713 ' : '\u2717 ') + 'שרת המשחק: ' + (workerUp ? 'פעיל' : 'לא פעיל') + '</div>');
            lines.push('<span class="raw">/api/new &rarr; ' + status + ' ' + body.slice(0, 40) + '</span>');
            draw();
            probe('/package.json', function (st2) {
              lines.push('<div>' + (st2 === 404 ? '\u2713 ' : '\u2717 ') + 'קבצים מוגשים: ' + (st2 === 404 ? 'dist (תקין)' : 'קוד מקור') + '</div>');
              lines.push('<span class="raw">/package.json &rarr; ' + st2 + '</span>');
              draw();
            });
          });
        }

        // Give the bundle a fair chance on a slow connection before giving up.
        setTimeout(function () { if (check()) diagnose(); }, 6000);
      })();
    </script>

    <script type="module" src="/src/client/main.jsx"></script>
  </body>
</html>
