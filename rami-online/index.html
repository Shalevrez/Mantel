<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ee" />
    <title>מנטל · אונליין</title>
    <!--
      Home-screen icon. iOS reads apple-touch-icon when the page is saved with
      "Add to Home Screen"; Android Chrome reads the manifest's icons. The
      manifest keeps display "browser", so a saved icon opens the game in the
      browser as before — it adds the icon, not an app-mode shell.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="מנטל" />
    <style>
      /*
        One typeface for the whole app: Assistant, which draws Hebrew, Latin and
        digits alike. The platform UI fonts don't — San Francisco and Roboto
        have no Hebrew, so a line like "רמה 3 · 1,200" came out in two fonts
        (Hebrew from a fallback, the numbers from the system font). The font
        files are bundled by Vite (imported in main.jsx) and served with the
        app, not from a font CDN; the browser only fetches the Hebrew and
        Latin files a page actually uses. Until they arrive, and anywhere
        Assistant has no glyph (card suits, emoji), the system stack takes over.
        This variable is the one place the font is named: everything else —
        table.css, the inline styles — uses var(--font-ui) or inherits it.
      */
      :root {
        --font-ui: "Assistant Variable", system-ui, -apple-system, "Segoe UI", Roboto,
                   "Helvetica Neue", "Noto Sans Hebrew", Arial, sans-serif;
      }

      html, body, #root { height: 100%; margin: 0; padding: 0; background: #faf6ee; }
      html, body { font-family: var(--font-ui); }
      /* Form controls don't inherit the page font by default — make them. */
      button, input, select, textarea { font-family: inherit; }

      /* dvh excludes the collapsible mobile URL bar; vh doesn't, which on a
         phone pushes the modal's footer button off the visible viewport.
         The vh line stays as the fallback for engines without dvh. */
      .rules-card { max-height: 88vh; max-height: 88dvh; }
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

      /* Dragging a card sideways is a game gesture. Without this, a drag that
         starts near the screen edge is read as Chrome's swipe-to-go-back (which
         leaves the game mid-round) and a downward one as pull-to-refresh. */
      html, body { overscroll-behavior: none; }

      /* A long press here means "pick this card up", never "select this text".
         Mobile browsers answer a long press with a text selection and a
         copy/lookup callout, which fights the drag — so both are switched off
         for the whole app. The `-webkit-` forms are not optional: iOS Safari
         below 16.4 only understands those. Inputs opt back in below. */
      html, body, #root {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input, textarea, [contenteditable] {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }

      /* Scrollbars in the app's colours (navy thumb, gold on hover, no arrow
         buttons) instead of the browser's grey default. Only for a real mouse:
         phones and tablets keep their native overlay scrollbar, which takes no
         room and fades away, so touch scrolling is untouched.
         Chrome 121+ ignores the ::-webkit-scrollbar rules once scrollbar-color
         is set, so the standard properties are kept for Firefox only. */
      @media (hover: hover) and (pointer: fine) {
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
          background: rgba(30, 58, 95, .35); border-radius: 8px;
          border: 2px solid transparent; background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover { background: #c9973a; background-clip: padding-box; }
        ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
        ::-webkit-scrollbar-corner { background: transparent; }
        @supports not selector(::-webkit-scrollbar) {
          * { scrollbar-width: thin; scrollbar-color: rgba(30, 58, 95, .35) transparent; }
        }
      }

      /* Boot failure panel — hidden until the watchdog below decides the app never mounted. */
      #boot-error {
        display: none;
        position: fixed; inset: 0; z-index: 9999;
        align-items: center; justify-content: center;
        padding: 16px; direction: rtl;
        background: #faf6ee;
      }
      #boot-error.show { display: flex; }
      #boot-error .card {
        background: #faf7f0; border-radius: 22px; padding: 26px 24px;
        max-width: 390px; width: 100%; text-align: center;
        border: 2px solid #c9a84777; box-shadow: 0 12px 40px rgba(19,40,79,.18);
      }
      #boot-error h1 { margin: 0 0 6px; font-size: 20px; color: #13284f; }
      #boot-error p { margin: 0 0 14px; font-size: 14px; color: #57534e; line-height: 1.6; }
      #boot-error code {
        display: block; margin: 10px 0 0; padding: 8px 10px; border-radius: 8px;
        background: #f5f5f4; color: #b91c1c; font-size: 12px; direction: ltr;
        text-align: left; white-space: pre-wrap; word-break: break-all; max-height: 120px;
        overflow: auto;
      }
      #boot-diag {
        margin-top: 10px; padding: 8px 10px; border-radius: 8px;
        background: #fafaf9; border: 1px solid #e7e5e4;
        font-size: 12px; color: #1c1917; line-height: 1.7; text-align: right;
      }
      /* Block, not inline: an LTR path inside an RTL panel gets its leading
         slash reordered to the end unless it sits in its own box. */
      #boot-diag .raw {
        display: block; direction: ltr; text-align: left; color: #57534e;
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
      }
      #boot-error button {
        width: 100%; padding: 13px 0; background: #1e3a5f; color: #c9a847;
        border: 2px solid #c9a84788; border-radius: 13px;
        font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-error">
      <div class="card">
        <div style="margin-bottom:6px;color:#1e3a5f"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.16em"><rect x="8" y="3" width="12" height="16" rx="2"/><path d="M4.5 7.5v11a2.5 2.5 0 0 0 2.5 2.5h8.5"/></svg></div>
        <h1>המשחק לא נטען</h1>
        <p>
          קבצי האפליקציה לא הגיעו מהשרת, ולכן המסך נשאר ריק.<br />
          בדרך כלל זה אומר שהאתר הועלה בלי <code style="display:inline;padding:1px 5px;color:#1e3a5f;background:#e7e5e4;direction:ltr">npm run build</code>
          או שתיקיית <code style="display:inline;padding:1px 5px;color:#1e3a5f;background:#e7e5e4;direction:ltr">dist</code> לא נפרסה.
        </p>
        <button onclick="location.reload()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.16em"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg> נסה שוב</button>
        <code id="boot-error-detail" style="display:none"></code>
        <div id="boot-diag" style="display:none"></div>
      </div>
    </div>

    <!--
      Classic (non-module) watchdog: it runs even when the module bundle itself
      fails to parse or 404s, which is exactly the case a module script cannot
      report for itself. Without it a broken deploy renders as a silent green page.
    -->
    <script>
      (function () {
        var detail = '';

        function note(msg) {
          if (!detail && msg) detail = String(msg).slice(0, 400);
        }

        // Resource errors (a 404 or wrong MIME on the bundle) do not bubble,
        // so listen in the capture phase.
        window.addEventListener('error', function (e) {
          if (e.target && e.target !== window && e.target.src) note('failed to load: ' + e.target.src);
          else note(e.message);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          note(e.reason && e.reason.message ? e.reason.message : e.reason);
        });

        // Returns true when the failure panel was shown, false when the app is fine.
        function check() {
          var root = document.getElementById('root');
          if (root && root.childNodes.length) return false; // React mounted — nothing to do.
          var panel = document.getElementById('boot-error');
          if (!panel) return false;
          if (detail) {
            var box = document.getElementById('boot-error-detail');
            box.textContent = detail;
            box.style.display = 'block';
          }
          panel.className = 'show';
          return true;
        }

        // Once we know the page is broken, ask the server two questions whose
        // answers separate "the Worker is not running at all" from "the Worker
        // runs but is serving the wrong files". Printed on the page so a
        // screenshot is enough to tell the two apart.
        function diagnose() {
          var box = document.getElementById('boot-diag');
          if (!box || !window.fetch) return;
          var lines = [];
          function draw() { box.innerHTML = lines.join(''); box.style.display = 'block'; }

          function probe(path, cb) {
            return fetch(path, { cache: 'no-store' }).then(function (r) {
              return r.text().then(function (t) { cb(r.status, t); });
            }).catch(function () { cb(0, ''); });
          }

          probe('/api/new', function (status, body) {
            var workerUp = status === 200 && body.indexOf('code') !== -1;
            lines.push('<div>' + (workerUp ? '\u2713 ' : '\u2717 ') + 'שרת המשחק: ' + (workerUp ? 'פעיל' : 'לא פעיל') + '</div>');
            lines.push('<span class="raw">/api/new &rarr; ' + status + ' ' + body.slice(0, 40) + '</span>');
            draw();
            probe('/package.json', function (st2) {
              lines.push('<div>' + (st2 === 404 ? '\u2713 ' : '\u2717 ') + 'קבצים מוגשים: ' + (st2 === 404 ? 'dist (תקין)' : 'קוד מקור') + '</div>');
              lines.push('<span class="raw">/package.json &rarr; ' + st2 + '</span>');
              draw();
            });
          });
        }

        // Give the bundle a fair chance on a slow connection before giving up.
        setTimeout(function () { if (check()) diagnose(); }, 6000);
      })();
    </script>

    <script type="module" src="/src/client/main.jsx"></script>
  </body>
</html>
