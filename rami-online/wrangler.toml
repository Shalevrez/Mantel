name = "rami-online"
main = "src/worker/index.js"
compatibility_date = "2024-09-01"

# Serve the built client (Vite output) as static assets.
# The Worker handles /api/* and falls through to these files for everything else.
[assets]
directory = "./dist"
binding = "ASSETS"

# One Durable Object class — "Room" — one live instance per room code.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Durable Objects must be declared in a migration.
[[migrations]]
tag = "v1"
new_classes = ["Room"]
